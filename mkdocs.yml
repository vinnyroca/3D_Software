markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      title: On this page
      toc_depth: 2

theme:
  favicon: 3D.png
  icon:
    logo: material/cube
  name: material
  highlightjs: true
  palette:
    scheme: default
    primary: white
    accent: black
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant: false
  font:
    text: Funnel Sans
    code: Inconsolata monospace
plugins:
  - search:
      enabled: true


extra_css:
- extra.css


  



  



